sonar.projectKey=fs-feup_autonomous-systems
sonar.organization=fs-feup
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=autonomous-systems
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Keep binary/generated/heavy artifacts out of source indexing. Sonar was
# trying to read images, meshes, PDFs, and build outputs as text.
sonar.exclusions=\
  **/build/**,\
  **/install/**,\
  **/log/**,\
  **/.git/**,\
  **/.ccache/**,\
  **/_ci_cache/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.pdf,\
  **/*.stl,\
  **/*.dae,\
  **/*.bag,\
  **/*.db3

sonar.python.version=3.10
