inverter:
  efficiency: 0.97
  max_phase_current: 400

  # Torque ramp times, for the full command range.
  acceleration_ramp_ms: 500
  regen_braking_ramp_ms: 500

  # Regen torque ceiling as a fraction of the drive limit.
  regen_torque_fraction: 0.887925

  # Torque limit programmed into the inverter
  modes:
    endurance: 150
    acceleration: 220
  selected_mode: "endurance"
