invictasim:
  # Simulator config
  input_adapter: "keyboard"  # Options: "ros", "keyboard"
  output_adapter: "ros"  # Options: "ros"
  vehicle_model: "FSFEUP02"  # Options: "FSFEUP02"
  timestep: 0.001  # seconds (0.001s = 1000 Hz)
  track_name: "FSG23"
  publish_frequencies:
    tire: 50
    battery: 50
    motor: 50
    differential: 50
    aero: 50
    load_transfer: 50
    status: 1000
    execution_times: 30
    visualization: 30