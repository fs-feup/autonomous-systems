invictasim:
  # Simulator config
  input_adapter: "keyboard"  # Options: "ros", "keyboard"
  output_adapter: "ros"  # Options: "ros"
  vehicle_model: "FSFEUP02"  # Options: "FSFEUP02"
  sim_frequency: 1000  # Hz 
  sim_speed: 1.0  # Sim velocity multiplier (1.0 = real-time, 2.0 = 2x real-time, etc.)
  initial_go_signal: false  # Initial state of the go signal 
  track_name: "FSG25"  # Options: "Acceleration", "Skidpad", "FSG25", "FSG24", "FSG23", "FSE24", "FSE23", "EnduranceFSG25", "FSS22V1", "FSS22V2"
  
