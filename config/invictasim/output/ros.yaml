publish_frequencies:
  vehicle_model:
    tire: 0          # Tire status (FX, FY, MY, MZ, slip ratio, slip angle)
    battery: 0       # Battery status (voltage, current, state of charge)
    motor: 0         # Motor status (RPM, torque, temperature)
    transmission: 0  # Transmission status (torque on each wheel)
    aero: 0          # Aerodynamic status (drag, downforce)
    status: 0        # Overall vehicle status (speed, acceleration, position, yaw, etc.)
  visualization:     # Visualization will work at the minimum of this frequencies (excluding 0s)
    car: 30           # Car visualization 
    ground: 30         # Ground visualization 
    ground_truth_cones: 0   # Ground-truth cones visualization
    slam_cones: 30          # SLAM cones visualization
    perception_cones: 0    # Perception cones visualization
  sensors:
    perception: 0      # Simulated perception output
    imu: 0             # Simulated IMU (free_acceleration, angular_velocity)
    wheel_speed: 0      # Simulated wheel speed sensors
    resolver: 0         # Simulated motor/resolver RPM
    steering: 0         # Simulated steering sensor
  map:
    ground_truth: 0       # Ground-truth track map
    simulated_slam: 10      # Simulated SLAM map 
  vehicle_state:
    pose: 10              # Simulated vehicle pose (slam output)
    velocities: 10        # Simulated velocities (velocity estimation output)
    operational_status: 1  # Simulated operational status (contains go_signal and mission)
  execution_time: 0      # Time taken for each simulation step (ms)