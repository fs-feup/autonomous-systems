publish_frequencies:
  vehicle_model:
    tire: 5                     # Tire status (FX, FY, MY, MZ, slip ratio, slip angle)
    battery: 5                  # Battery status (voltage, current, state of charge)
    motor: 5                    # Motor status (RPM, torque, temperature)
    transmission: 5             # Transmission status (torque on each wheel)
    aero: 5                     # Aerodynamic status (drag, downforce)
    status: 10                  # Overall vehicle status (speed, acceleration, position, yaw, etc.) -- MPC/control input on /invictasim/vehicle_model/status
  visualization:                
    car: 60                     # Car visualization 
    ground: 1                   # Ground visualization 
    ground_truth_cones: 1       # Ground-truth cones visualization
    slam_cones: 10              # SLAM cones visualization (simulated or from state estimation)
    perception_cones: 10        # Perception cones visualization (simulated or from perception)
  sensors:
    imu: 100                    # Simulated IMU (free_acceleration, angular_velocity)
    wheel_speed: 100            # Simulated wheel speed sensors, all four wheels
    resolver: 100               # Simulated motor/resolver RPM
    steering: 100               # Simulated steering sensor
  map:
    perception: 20              # Simulated perception output (only when use_simulated_perception)
    ground_truth: 1             # Ground-truth track map
    simulated_slam: 10          # Simulated SLAM map 
  vehicle_state:
    pose: 50                    # Simulated vehicle pose (slam output)
    state_vector: 50            # Simulated vehicle state vector (MPC input)
    velocities: 50              # Simulated velocities (velocity estimation output)
    operational_status: 1       # Simulated operational status (contains go_signal and mission)
  statistics:
    lap_summary: 1              # End-of-lap summary: 0 disables, 1 enables
    lap_current: 30              # Current lap number, lap time, and cones hit
    control_statistics: 10      # Velocity and path tracking errors
    lap_counter: 5              # Lap counter (slam output)
  execution_time: 2             # Time taken for each simulation step (ms)
