publish_frequencies:
  vehicle_model:
    tire: 10          # Tire status (FX, FY, MY, MZ, slip ratio, slip angle)
    battery: 10       # Battery status (voltage, current, state of charge)
    motor: 10         # Motor status (RPM, torque, temperature)
    transmission: 10  # Transmission status (torque on each wheel)
    aero: 10          # Aerodynamic status (drag, downforce)
    status: 10        # Overall vehicle status (speed, acceleration, position, yaw, etc.)
  visualization:     # Visualization will work at the minimum of this frequencies (excluding 0s)
    car: 30           # Car visualization 
    ground: 30         # Ground visualization 
    ground_truth_cones: 30   # Ground-truth cones visualization
    slam_cones: 0          # SLAM cones visualization
    perception_cones: 0    # Perception cones visualization
  sensors:
    perception: 0      # Simulated perception output
    imu: 100             # Simulated IMU (free_acceleration, angular_velocity)
    wheel_speed: 50      # Simulated wheel speed sensors
    resolver: 10         # Simulated motor/resolver RPM
    steering: 50         # Simulated steering sensor
  map:
    ground_truth: 0       # Ground-truth track map
    simulated_slam: 0      # Simulated SLAM map 
  vehicle_state:
    pose: 0              # Simulated vehicle pose (slam output)
    velocities: 0        # Simulated velocities (velocity estimation output)
    operational_status: 0  # Simulated operational status (contains go_signal and mission)
  execution_time: 0      # Time taken for each simulation step (ms)