tuning:
  # The path to your standard car configuration file so the simulator has a baseline
  base_car_config: "config/car/02.yaml" 
  
  # Select the inline model to use (matches the C++ string you check in main)
  vehicle_model: "inline_02"

  csvs:
    - path: "acceleration_run.csv" # Point to the CSV generated by the Python script
      weight: 1.0
      start_offset_s: 0.0
      stop_after_s: 9.3

  score:
    min_samples: 140
    short_sample_penalty: 1000.0 # Heavy penalty if the car crashes or stops early
    weights:
      velocity_x_rmse: 6.0
      front_wheel_rpm_rmse: 0.040
      motor_rpm_rmse: 0.010
      position_rmse: 0.2
      velocity_y_rmse: 0.05
      heading_rmse: 0.05
      yaw_rate_rmse: 0.02

  optimizer:
    # Genetic Algorithm Settings (mapped to the C++ variables)
    generations: 1000000
    population_size: 150      # Increased for wider search space
    elite_count: 5            # Keep the top 5 strictly safe
    immigrant_count: 15       # Inject 15 completely random sets every generation
    mutation_rate: 0.35       # Probability of a gene mutating
    mutation_scale: 0.40      # How drastic the mutation is (Increased!)
    blend_alpha: 0.60         # Increased to encourage extrapolation
    tournament_size: 3
    seed: 31

  parameters:
    - name: "inverter.max_phase_current"
      min: 220.0
      max: 420.0

    - name: "inverter.acceleration_delay_ms"
      min: 0.0
      max: 700.0

    - name: "battery.max_discharge_current"
      min: 130.0
      max: 230.0

    - name: "transmission.viscous_drag_coeff"
      min: 0.0
      max: 0.5

    - name: "transmission.coulomb_drag"
      min: 0.0
      max: 8.0

    - name: "transmission.efficiency"
      min: 0.88
      max: 0.99

    - name: "tire.effective_tire_r"
      min: 0.16
      max: 0.24

    - name: "tire.slip_ratio_relaxation_length"
      min: 0.0
      max: 0.12
    
    - name: "tire.slip_angle_relaxation_length"
      min: 0.0
      max: 0.12

    # Note: These names are updated to match the C++ string map in get_parameter_ptrs()!
    - name: "tire.LMUX"
      min: 0.65
      max: 1.90

    - name: "tire.LKX"
      min: 0.55
      max: 1.60

    - name: "tire.PDX1"
      min: 0.50
      max: 2.50

    - name: "tire.PKX1"
      min: 20.0
      max: 140.0

    - name: "tire.PEX1"
      min: 0.45
      max: 1.60

    - name: "tire.LONGITUDINAL_STIFFNESS"
      min: 180000.0
      max: 450000.0
    
    - name: "steering_motor.time_constant"
      min: 0.10
      max: 0.250

    - name: "motor.max_peak_rpm"
      min: 3250.0
      max: 9750.0

    - name: "motor.max_continuous_rpm"
      min: 2750.0
      max: 8250.0

    - name: "motor.max_peak_current"
      min: 180.0
      max: 540.0

    - name: "motor.max_continuous_current"
      min: 90.0
      max: 270.0

    - name: "motor.max_continuous_power"
      min: 32000.0
      max: 96000.0

    - name: "motor.max_peak_power"
      min: 62000.0
      max: 186000.0

    - name: "motor.max_continuous_torque"
      min: 56.0
      max: 168.0

    - name: "motor.max_peak_torque"
      min: 220.0
      max: 240.0

    - name: "motor.kt_constant"
      min: 0.70
      max: 0.80

    - name: "transmission.efficiency"
      min: 0.8
      max: 0.999

    - name: "transmission.kv"
      min: 9.24
      max: 87.72

    - name: "transmission.t_max"
      min: 180.75
      max: 542.25

    - name: "transmission.viscous_drag_coeff"
      min: 0.0
      max: 0.1

    - name: "transmission.coulomb_drag"
      min: 0.0
      max: 4.0

    - name: "transmission.coulomb_smooth_stiffness"
      min: 10.0
      max: 30.0

    - name: "steering.ackerman_factor"
      min: 0.112
      max: 0.337

    - name: "steering_motor.kp"
      min: 0.00125
      max: 0.00375

    - name: "steering_motor.ki"
      min: 0.005
      max: 0.015

    - name: "steering_motor.kd"
      min: 0.000005
      max: 0.000015

    - name: "steering_motor.time_constant"
      min: 0.077
