tuning:
  # The path to your standard car configuration file so the simulator has a baseline
  base_car_config: "config/car/02.yaml" 
  
  # Select the inline model to use (matches the C++ string you check in main)
  vehicle_model: "inline_02"

  csvs:
    - path: "acceleration_run.csv" # Point to the CSV generated by the Python script
      weight: 1.0
      start_offset_s: 0.0
      stop_after_s: 9.3

  score:
    max_distance_error: 0.5 # Extremely tight 0.5m distance error tolerance
    ignore_lateral_distance: true # Purely compares forward distance traveled, ignoring sideways steering/drift errors

  optimizer:
    # Genetic Algorithm Settings
    generations: 50000
    population_size: 150      
    elite_count: 5            
    immigrant_count: 15       
    mutation_rate: 0.35       
    mutation_scale: 0.40      
    blend_alpha: 0.60         
    tournament_size: 3
    seed: 31

  parameters:
    # --- INVERTER & BATTERY (Power Delivery) ---
    - name: "inverter.max_phase_current"
      min: 220.0
      max: 420.0

    - name: "inverter.acceleration_delay_ms"
      min: 0.0
      max: 700.0

    - name: "battery.max_discharge_current"
      min: 130.0
      max: 230.0

    # --- MOTOR SPECS (Torque & RPM) ---
    - name: "motor.max_peak_rpm"
      min: 3250.0
      max: 7000.0

    - name: "motor.max_continuous_rpm"
      min: 2750.0
      max: 6000.0

    - name: "motor.max_peak_current"
      min: 180.0
      max: 540.0

    - name: "motor.max_continuous_current"
      min: 90.0
      max: 270.0

    - name: "motor.max_continuous_power"
      min: 32000.0
      max: 96000.0

    - name: "motor.max_peak_power"
      min: 62000.0
      max: 186000.0

    - name: "motor.max_continuous_torque"
      min: 56.0
      max: 168.0

    - name: "motor.max_peak_torque"
      min: 220.0
      max: 240.0

    - name: "motor.kt_constant"
      min: 0.70
      max: 0.80

    # --- TRANSMISSION (Efficiency & Drag) ---
    - name: "transmission.efficiency"
      min: 0.85
      max: 0.999

    - name: "transmission.kv"
      min: 9.24
      max: 87.72

    - name: "transmission.viscous_drag_coeff"
      min: 0.0
      max: 0.3

    - name: "transmission.coulomb_drag"
      min: 0.0
      max: 8.0

    - name: "transmission.coulomb_smooth_stiffness"
      min: 0.0
      max: 30.0

    # Note: Differential preload/ramps are omitted here because both wheels have identical grip
    # in an ideal straight line, meaning differential slip is near 0.

    # --- TIRE PURELY LONGITUDINAL PARAMETERS ---
    - name: "tire.effective_tire_r"
      min: 0.16
      max: 0.24

    - name: "tire.slip_ratio_relaxation_length"
      min: 0.0
      max: 0.12

    - name: "tire.LMUX"
      min: 0.65
      max: 1.90

    - name: "tire.LKX"
      min: 0.55
      max: 1.60

    - name: "tire.PDX1"
      min: 0.50
      max: 2.50

    - name: "tire.PKX1"
      min: 20.0
      max: 140.0

    - name: "tire.PEX1"
      min: 0.45
      max: 1.60

    - name: "tire.LONGITUDINAL_STIFFNESS"
      min: 180000.0
      max: 450000.0
