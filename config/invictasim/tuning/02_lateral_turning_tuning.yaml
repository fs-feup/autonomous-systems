tuning:
  bags:
    - name: "skidpad"
      path: "/home/ws/Skidpad DV Aerodromo 3.mcap"
      track_name: "Skidpad"
      discipline: "skidpad"
      weight: 1.5
      start_offset_s: 10.0
      stop_after_bag_s: 62.0
      max_wall_time_s: 30.0

    - name: "feup"
      path: "/home/ws/FEUP Trackdrive 17.mcap"
      track_name: "FEUP"
      discipline: "autocross"
      weight: 1.0
      start_offset_s: 9.0
      stop_after_bag_s: 91.0
      max_wall_time_s: 30.0

    - name: "acceleration_guard"
      path: "/home/ws/DV Acceleration 31.mcap"
      track_name: "Acceleration"
      discipline: "acceleration"
      weight: 0.6
      start_offset_s: 0.0
      stop_after_bag_s: 11.0
      max_wall_time_s: 12.0
      score:
        min_samples: 120
        min_usable_samples: 80
        short_sample_penalty: 40.0
        weights:
          velocity_x_rmse: 7.0
          velocity_x_slow_rmse: 18.0
          front_wheel_rpm_rmse: 0.035
          motor_rpm_rmse: 0.010
          position_rmse: 0.15
          heading_rmse: 0.05
          yaw_rate_rmse: 0.02

  playback:
    rate: 4.0
    sim_speed: 4.0
    startup_sleep_s: 2.0
    shutdown_grace_s: 2.0
    topics:
      - "/control/command"
      - "/state_estimation/vehicle_pose"
      - "/state_estimation/velocities"
      - "/vehicle/fl_rpm"
      - "/vehicle/fr_rpm"
      - "/vehicle/motor_rpm"

  score:
    min_samples: 180
    min_usable_samples: 80
    short_sample_penalty: 40.0
    weights:
      position_rmse: 1.6
      heading_rmse: 5.0
      yaw_rate_rmse: 8.0
      yaw_rate_under_rmse: 8.0
      velocity_y_rmse: 2.5
      velocity_x_rmse: 8.0
      velocity_x_slow_rmse: 28.0
      front_wheel_rpm_rmse: 0.010
      motor_rpm_rmse: 0.003
  # Goal: make the car turn more for the same steering command without solving
  # the error by losing longitudinal velocity. The search therefore tunes tire
  # lateral stiffness/shape and small steering geometry effects, while the score
  # strongly punishes sim velocity_x below the real bag velocity.
  #
  # Avoid aero/drag/motor/inverter torque here: those can improve the trajectory
  # by changing acceleration, which is exactly the failure mode we are trying to
  # avoid. A small set of longitudinal tire parameters is allowed because
  # longitudinal slip/combined tire behavior can block lateral force in turns.
  initial_values:
    steering.ackerman_factor: 0.02
    tire.effective_tire_r: 0.18217369020446572
    tire.slip_ratio_relaxation_length: 0.0475034894401475
    tire.slip_angle_relaxation_length: 0.0005
    tire.longitudinal_peak_scale: 1.493161901474767
    tire.longitudinal_stiffness_scale: 1.1247054264980267
    tire.lateral_shape_scale: 1.0
    tire.lateral_peak_scale: 1.35
    tire.lateral_curvature_scale: 1.0
    tire.lateral_stiffness_scale: 6.5
    tire.combined_slip_lateral_stiffness_scale: 1.0
    tire.longitudinal_peak_pdx1: 1.0553523312698423
    tire.longitudinal_stiffness_pkx1: 25.0
    tire.longitudinal_curvature_pex1: 1.4301675997941354
    tire.lateral_peak_pdy1: 2.9
    tire.lateral_stiffness_pky1: -260.0
    tire.lateral_curvature_pey1: 0.05
    tire.structural_longitudinal_stiffness: 322204.3901689281
    tire.structural_lateral_stiffness: 750000.0
    tire.structural_yaw_stiffness: 45000.0

  optimizer:
    method: "staged_genetic"
    seed: 82
    population_size: 30
    elite_count: 6
    immigrant_count: 4
    mutation_rate: 0.28
    mutation_scale: 0.075
    blend_alpha: 0.30
    tournament_size: 3
    local_seed_count: 12
    local_seed_radius: 0.08
    final_validation: true
    stages:
      - name: "skidpad_lateral_force"
        bag_names: ["skidpad"]
        generations: 28
        population_size: 42
        elite_count: 9
        immigrant_count: 7
        mutation_rate: 0.30
        mutation_scale: 0.080
        local_seed_radius: 0.075
        long_eval_top_k: 6
        long_eval_stop_after_bag_s: 62.0
        parameter_names:
          - "steering.ackerman_factor"
          - "tire.effective_tire_r"
          - "tire.slip_ratio_relaxation_length"
          - "tire.slip_angle_relaxation_length"
          - "tire.longitudinal_peak_scale"
          - "tire.longitudinal_stiffness_scale"
          - "tire.lateral_shape_scale"
          - "tire.lateral_peak_scale"
          - "tire.lateral_curvature_scale"
          - "tire.lateral_stiffness_scale"
          - "tire.combined_slip_lateral_stiffness_scale"
          - "tire.longitudinal_peak_pdx1"
          - "tire.longitudinal_stiffness_pkx1"
          - "tire.longitudinal_curvature_pex1"
          - "tire.lateral_peak_pdy1"
          - "tire.lateral_stiffness_pky1"
          - "tire.lateral_curvature_pey1"
          - "tire.structural_longitudinal_stiffness"
          - "tire.structural_lateral_stiffness"
          - "tire.structural_yaw_stiffness"
        score:
          min_samples: 180
          min_usable_samples: 80
          short_sample_penalty: 45.0
          weights:
            position_rmse: 1.4
            heading_rmse: 5.5
            yaw_rate_rmse: 10.0
            yaw_rate_under_rmse: 12.0
            velocity_y_rmse: 3.0
            velocity_x_rmse: 8.0
            velocity_x_slow_rmse: 34.0
            front_wheel_rpm_rmse: 0.010
            motor_rpm_rmse: 0.003
      - name: "feup_speed_preservation"
        bag_names: ["feup"]
        generations: 20
        population_size: 38
        elite_count: 8
        immigrant_count: 6
        mutation_rate: 0.26
        mutation_scale: 0.065
        local_seed_radius: 0.060
        long_eval_top_k: 5
        long_eval_stop_after_bag_s: 91.0
        parameter_names:
          - "steering.ackerman_factor"
          - "tire.effective_tire_r"
          - "tire.slip_ratio_relaxation_length"
          - "tire.slip_angle_relaxation_length"
          - "tire.longitudinal_peak_scale"
          - "tire.longitudinal_stiffness_scale"
          - "tire.lateral_shape_scale"
          - "tire.lateral_peak_scale"
          - "tire.lateral_curvature_scale"
          - "tire.lateral_stiffness_scale"
          - "tire.combined_slip_lateral_stiffness_scale"
          - "tire.longitudinal_peak_pdx1"
          - "tire.longitudinal_stiffness_pkx1"
          - "tire.longitudinal_curvature_pex1"
          - "tire.lateral_peak_pdy1"
          - "tire.lateral_stiffness_pky1"
          - "tire.lateral_curvature_pey1"
          - "tire.structural_longitudinal_stiffness"
          - "tire.structural_lateral_stiffness"
          - "tire.structural_yaw_stiffness"
        score:
          min_samples: 200
          min_usable_samples: 90
          short_sample_penalty: 35.0
          weights:
            position_rmse: 1.8
            heading_rmse: 5.0
            yaw_rate_rmse: 8.0
            yaw_rate_under_rmse: 8.0
            velocity_y_rmse: 2.5
            velocity_x_rmse: 9.0
            velocity_x_slow_rmse: 36.0
            front_wheel_rpm_rmse: 0.012
            motor_rpm_rmse: 0.0035
      - name: "skidpad_feup_balance"
        bag_names: ["skidpad", "feup", "acceleration_guard"]
        generations: 12
        population_size: 36
        elite_count: 8
        immigrant_count: 5
        mutation_rate: 0.22
        mutation_scale: 0.050
        local_seed_radius: 0.045
        long_eval_top_k: 5
        long_eval_stop_after_bag_s: 91.0
        parameter_names:
          - "steering.ackerman_factor"
          - "tire.effective_tire_r"
          - "tire.slip_ratio_relaxation_length"
          - "tire.slip_angle_relaxation_length"
          - "tire.longitudinal_peak_scale"
          - "tire.longitudinal_stiffness_scale"
          - "tire.lateral_shape_scale"
          - "tire.lateral_peak_scale"
          - "tire.lateral_curvature_scale"
          - "tire.lateral_stiffness_scale"
          - "tire.combined_slip_lateral_stiffness_scale"
          - "tire.longitudinal_peak_pdx1"
          - "tire.longitudinal_stiffness_pkx1"
          - "tire.longitudinal_curvature_pex1"
          - "tire.lateral_peak_pdy1"
          - "tire.lateral_stiffness_pky1"
          - "tire.lateral_curvature_pey1"
          - "tire.structural_longitudinal_stiffness"
          - "tire.structural_lateral_stiffness"
          - "tire.structural_yaw_stiffness"
        score:
          bag_scores:
            skidpad:
              min_samples: 180
              min_usable_samples: 80
              short_sample_penalty: 40.0
              weights:
                position_rmse: 1.6
                heading_rmse: 5.2
                yaw_rate_rmse: 9.0
                yaw_rate_under_rmse: 9.0
                velocity_y_rmse: 2.8
                velocity_x_rmse: 9.0
                velocity_x_slow_rmse: 38.0
                front_wheel_rpm_rmse: 0.012
                motor_rpm_rmse: 0.0035
            feup:
              min_samples: 200
              min_usable_samples: 90
              short_sample_penalty: 35.0
              weights:
                position_rmse: 1.8
                heading_rmse: 5.0
                yaw_rate_rmse: 8.0
                yaw_rate_under_rmse: 8.0
                velocity_y_rmse: 2.5
                velocity_x_rmse: 9.0
                velocity_x_slow_rmse: 36.0
                front_wheel_rpm_rmse: 0.012
                motor_rpm_rmse: 0.0035
            acceleration_guard:
              min_samples: 120
              min_usable_samples: 80
              short_sample_penalty: 40.0
              weights:
                velocity_x_rmse: 7.0
                velocity_x_slow_rmse: 18.0
                front_wheel_rpm_rmse: 0.035
                motor_rpm_rmse: 0.010
                position_rmse: 0.15
                heading_rmse: 0.05
                yaw_rate_rmse: 0.02

  parameters:
    - name: "steering.ackerman_factor"
      file: "config/car/steering_model/02_steering.yaml"
      path: ["steering", "ackerman_factor"]
      min: -0.10
      max: 0.35

    - name: "tire.effective_tire_r"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "effective_tire_r"]
      min: 0.178
      max: 0.192

    - name: "tire.slip_ratio_relaxation_length"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "slip_ratio_relaxation_length"]
      min: 0.015
      max: 0.080

    - name: "tire.slip_angle_relaxation_length"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "slip_angle_relaxation_length"]
      min: 0.0
      max: 0.008

    - name: "tire.longitudinal_peak_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LMUX"]
      min: 1.00
      max: 1.90

    - name: "tire.longitudinal_stiffness_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LKX"]
      min: 0.75
      max: 1.80

    - name: "tire.lateral_shape_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LCY"]
      min: 0.75
      max: 1.35

    - name: "tire.lateral_peak_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LMUY"]
      min: 0.90
      max: 2.40

    - name: "tire.lateral_curvature_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LEY"]
      min: 0.50
      max: 1.60

    - name: "tire.lateral_stiffness_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LKY"]
      min: 2.00
      max: 14.00

    - name: "tire.combined_slip_lateral_stiffness_scale"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "scaling_coefficients", "LYKA"]
      min: 0.70
      max: 1.50

    - name: "tire.longitudinal_peak_pdx1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "longitudinal_coefficients", "PDX1"]
      min: 0.80
      max: 1.40

    - name: "tire.longitudinal_stiffness_pkx1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "longitudinal_coefficients", "PKX1"]
      min: 20.0
      max: 70.0

    - name: "tire.longitudinal_curvature_pex1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "longitudinal_coefficients", "PEX1"]
      min: 0.70
      max: 1.70

    - name: "tire.lateral_peak_pdy1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "lateral_coefficients", "PDY1"]
      min: 1.80
      max: 4.80

    - name: "tire.lateral_stiffness_pky1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "lateral_coefficients", "PKY1"]
      min: -520.0
      max: -80.0

    - name: "tire.lateral_curvature_pey1"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "lateral_coefficients", "PEY1"]
      min: -0.50
      max: 1.00

    - name: "tire.structural_longitudinal_stiffness"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "structural", "LONGITUDINAL_STIFFNESS"]
      min: 180000.0
      max: 600000.0

    - name: "tire.structural_lateral_stiffness"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "structural", "LATERAL_STIFFNESS"]
      min: 100000.0
      max: 1500000.0

    - name: "tire.structural_yaw_stiffness"
      file: "config/car/tire_model/02_tire.yaml"
      path: ["tire", "structural", "YAW_STIFFNESS"]
      min: 1000.0
      max: 100000.0
