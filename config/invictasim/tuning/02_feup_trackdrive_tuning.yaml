tuning:
  # Base car configuration file for simulator baseline
  base_car_config: "config/car/02.yaml" 
  
  # Inline model string
  vehicle_model: "inline_02"

  csvs:
    - path: "FEUP_trackdrive.csv"
      weight: 1.0
      start_offset_s: 9.0
      stop_after_s: 141.0

  score:
    max_distance_error: 2.5 # Maximum allowed distance error in meters before a mutation is killed immediately

  optimizer:
    # Genetic Algorithm Settings
    generations: 1000000
    population_size: 1000
    elite_count: 20
    immigrant_count: 100
    mutation_rate: 0.25
    mutation_scale: 0.20
    blend_alpha: 0.40
    tournament_size: 4
    seed: 67

  parameters:
    # =============================================
    # VEHICLE WHEEL INERTIA (Front vs Rear)
    # =============================================
    - name: "car.front_wheel_inertia"
      min: 0.10
      max: 0.40

    - name: "car.rear_wheel_inertia"
      min: 0.20
      max: 0.70

    # =============================================
    # AERODYNAMICS
    # =============================================
    - name: "aero.lift_coefficient"
      min: 1.0
      max: 4.0

    - name: "aero.drag_coefficient"
      min: 0.5
      max: 2.0

    - name: "aero.aero_balance_front"
      min: 0.3
      max: 0.7

    # =============================================
    # INVERTER DELAYS & MOTOR FADE
    # =============================================
    - name: "inverter.acceleration_delay_ms"
      min: 0.0
      max: 700.0

    - name: "inverter.coast_delay_ms"
      min: 0.0
      max: 700.0

    - name: "inverter.regen_braking_delay_ms"
      min: 0.0
      max: 700.0

    - name: "motor.fade_start"
      min: 0.70
      max: 0.99

    # =============================================
    # STEERING MOTOR
    # =============================================
    - name: "steering_motor.time_constant"
      min: 0.01
      max: 0.25

    # =============================================
    # TIRE MODEL PARAMETERS
    # =============================================
    - name: "tire.effective_tire_r"
      min: 0.16
      max: 0.24

    - name: "tire.slip_ratio_relaxation_length"
      min: 0.0
      max: 0.15

    - name: "tire.slip_angle_relaxation_length"
      min: 0.0
      max: 0.15

    # Tire Pacejka MF6.2 Scaling Factors & Parameters
    - name: "tire.LMUX"
      min: 0.5
      max: 1.8

    - name: "tire.LKX"
      min: 0.5
      max: 1.8

    - name: "tire.PDX1"
      min: 0.5
      max: 2.5

    - name: "tire.PKX1"
      min: 20.0
      max: 200.0

    - name: "tire.PCX1"
      min: 1.1
      max: 1.8

    - name: "tire.PEX1"
      min: 0.4
      max: 1.6

    - name: "tire.LONGITUDINAL_STIFFNESS"
      min: 150000.0
      max: 500000.0

    - name: "tire.LMUY"
      min: 0.5
      max: 1.8

    - name: "tire.LKY"
      min: 3.0
      max: 15.0

    - name: "tire.PCY1"
      min: 1.1
      max: 1.8

    - name: "tire.PDY1"
      min: 0.9
      max: 2.7

    - name: "tire.PKY1"
      min: -450.0
      max: -100.0

    - name: "tire.PEY1"
      min: 0.3
      max: 1.1

    - name: "tire.LATERAL_STIFFNESS"
      min: 100000.0
      max: 400000.0

    # =============================================
    # LOAD TRANSFER PARAMETERS
    # =============================================
    - name: "load_transfer.front_stiffness_distribution"
      min: 0.30
      max: 0.70

    - name: "load_transfer.roll_axis_z"
      min: 0.01
      max: 0.15

    - name: "load_transfer.front_roll_center_z"
      min: 0.01
      max: 0.12

    - name: "load_transfer.rear_roll_center_z"
      min: 0.01
      max: 0.12

    - name: "load_transfer.pitch_center_z"
      min: 0.005
      max: 0.08

    # =============================================
    # TRANSMISSION & DIFFERENTIAL
    # =============================================
    - name: "transmission.preload"
      min: 10.0
      max: 60.0

    - name: "transmission.drive_ramp_effect"
      min: 0.5
      max: 2.0

    - name: "transmission.coast_ramp_effect"
      min: 0.05
      max: 0.8

    - name: "transmission.viscous_drag_coeff"
      min: 0.0
      max: 0.3

    - name: "transmission.coulomb_drag"
      min: 0.0
      max: 8.0

    - name: "transmission.coulomb_smooth_stiffness"
      min: 0.0
      max: 30.0

    # =============================================
    # CAR DRAG & CG GEOMETRY
    # =============================================
    - name: "car.front_bearing_drag"
      min: 0.0
      max: 0.5

    - name: "car.cg_height"
      min: 0.175
      max: 0.240

    - name: "car.cg_2_rear_axis"
      min: 0.720
      max: 0.970
