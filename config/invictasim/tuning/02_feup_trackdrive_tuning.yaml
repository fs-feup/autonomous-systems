tuning:
  # The path to your standard car configuration file so the simulator has a baseline
  base_car_config: "config/car/02.yaml" 
  
  # Select the inline model to use (matches the C++ string you check in main)
  vehicle_model: "inline_02"

  csvs:
    - path: "FEUP_trackdrive.csv" # Point to the CSV generated by the Python script
      weight: 1.0
      start_offset_s: 9.0
      stop_after_s: 141.0

  score:
    max_distance_error: 1.0 # Maximum allowed distance error in meters before a mutation is killed immediately

  optimizer:
    # Genetic Algorithm Settings (mapped to the C++ variables)
    generations: 1000000
    population_size: 1000
    elite_count: 10
    immigrant_count: 40
    mutation_rate: 0.10
    mutation_scale: 0.15
    blend_alpha: 0.25
    tournament_size: 4
    seed: 31

  parameters:
    # Aero
    - name: "aero.lift_coefficient"
      min: 1.0
      max: 4.0

    - name: "aero.drag_coefficient"
      min: 0.5
      max: 2.0

    - name: "aero.aero_balance_front"
      min: 0.3
      max: 0.7

    # Inverter
    - name: "inverter.acceleration_delay_ms"
      min: 0.0
      max: 700.0

    - name: "inverter.coast_delay_ms"
      min: 0.0
      max: 700.0

    - name: "inverter.regen_braking_delay_ms"
      min: 0.0
      max: 700.0

    # Motor
    - name: "motor.fade_start"
      min: 0.7
      max: 0.99

    # Steering
    - name: "steering.ackerman_factor"
      min: 0.1
      max: 0.4

    - name: "steering_motor.time_constant"
      min: 0.05
      max: 0.25

    # Tire (BCDE)
    - name: "tire.tire_B_longitudinal"
      min: 8.0
      max: 18.0

    - name: "tire.tire_C_longitudinal"
      min: 1.0
      max: 2.0

    - name: "tire.tire_D_longitudinal"
      min: 1.0
      max: 2.5

    - name: "tire.tire_E_longitudinal"
      min: 0.0
      max: 1.5

    - name: "tire.tire_B_lateral"
      min: 5.0
      max: 15.0

    - name: "tire.tire_C_lateral"
      min: 1.0
      max: 2.0

    - name: "tire.tire_D_lateral"
      min: 1.0
      max: 2.5

    - name: "tire.tire_E_lateral"
      min: 0.0
      max: 1.5

    # Transmission
    - name: "transmission.preload"
      min: 10.0
      max: 60.0

    - name: "transmission.drive_ramp_effect"
      min: 0.5
      max: 2.0

    - name: "transmission.coast_ramp_effect"
      min: 0.05
      max: 0.8

    - name: "transmission.coulomb_drag"
      min: 0.0
      max: 5.0

    # Car/General
    - name: "car.front_bearing_drag"
      min: 0.0
      max: 0.5
