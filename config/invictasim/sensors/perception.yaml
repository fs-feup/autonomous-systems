lidar_sensor:
    # Physical sensor parameters
    height: 1.1                       # Height of LiDAR relative to vehicle origin (meters)
    max_range: 30           # Maximum detection range (meters)
    horizontal_fov_angle: 114.59      # Horizontal field of view (degrees) - approximately 180 degrees
    vertical_fov_angle: 20.0        # Vertical field of view (degrees) - approximately 20 degrees
    mounting_pitch: 4.98      # Mounting pitch angle (degrees)
    
    # Detection probability parameters
    detection_probability_alpha: 0.2     # Alpha parameter for sigmoid curve steepness (higher = steeper drop-off)
    
    # Noise parameters
    noise_std_dev_base: 0.02             # Base standard deviation for Gaussian noise (meters)
    noise_scales_with_range: true        # Whether noise increases with range
    noise_range_scaling: 0.001           # Scaling factor for range-dependent noise


