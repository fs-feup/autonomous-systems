# Simulated LiDAR cone pipeline. Cones are reported in the vehicle frame (x forward, y left).
lidar_sensor:
  # Sensor geometry
  height: 0.80                        # LiDAR height above the ground (m)
  cone_height: 0.16                   # Height of the cone centroid the beam returns from (m)
  max_range: 30.0                     # Range at which detection probability is 50% (m)
  horizontal_fov_angle: 120.0         # Horizontal field of view (degrees, centred on straight ahead)
  vertical_fov_angle: 20.0            # Vertical field of view (degrees)
  mounting_pitch: 5.0                 # Mounting pitch, positive nose-down (degrees)

  # Detection probability
  detection_probability_alpha: 0.5    # Sigmoid steepness of the range roll-off (higher = sharper)

  # Position noise
  noise_std_dev_base: 0.02            # Position noise at zero range (m)
  noise_scales_with_range: true       # Whether noise grows with range
  noise_range_scaling: 0.004          # Extra position noise per metre of range (m/m)

  # Spurious detections
  outlier_rate_hz: 0.5                # Expected spurious detections per second
  persistent_outlier_chance: 0.05     # Chance a spurious detection is retained across frames
