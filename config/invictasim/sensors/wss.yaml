wss_sensor:
  # Per-wheel error model. speed_cutoff and noise std_dev are in rad/s; quantization_bits is the
  # ADC resolution over a +/-4000 rpm full scale (0 disables quantisation).

  # Front Right Wheel
  fr:
    noise:
      std_dev: 0.4
    outliers:
      probability: 0.002
      impact_factor: 0.3
    dropout_probability: 0.002
    speed_cutoff: 0.01
    quantization_bits: 12

  # Front Left Wheel
  fl:
    noise:
      std_dev: 0.4
    outliers:
      probability: 0.002
      impact_factor: 0.3
    dropout_probability: 0.002
    speed_cutoff: 0.01
    quantization_bits: 12

  # Rear Right Wheel
  rr:
    noise:
      std_dev: 0.4
    outliers:
      probability: 0.002
      impact_factor: 0.3
    dropout_probability: 0.002
    speed_cutoff: 0.01
    quantization_bits: 12

  # Rear Left Wheel
  rl:
    noise:
      std_dev: 0.4
    outliers:
      probability: 0.002
      impact_factor: 0.3
    dropout_probability: 0.002
    speed_cutoff: 0.01
    quantization_bits: 12
