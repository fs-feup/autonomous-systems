# Wheel Speed Sensor (WSS) Configuration
# Per wheel. Noise is in rad/s (0.2 rad/s is about 2 rpm); speeds are published in rpm.
wss_sensor:

  fr:
    noise:
      std_dev: 0.2              # rad/s
    outliers:
      probability: 0.001        # per sample
      impact_factor: 0.1        # fraction of the measurement
    dropout_probability: 0.0005 # per sample, reads zero
    speed_cutoff: 0.01          # below this the sensor reads zero (rad/s)
    quantization_bits: 12       # ADC resolution over [-4000, 4000] rpm

  fl:
    noise:
      std_dev: 0.2
    outliers:
      probability: 0.001
      impact_factor: 0.1
    dropout_probability: 0.0005
    speed_cutoff: 0.01
    quantization_bits: 12

  rr:
    noise:
      std_dev: 0.2
    outliers:
      probability: 0.001
      impact_factor: 0.1
    dropout_probability: 0.0005
    speed_cutoff: 0.01
    quantization_bits: 12

  rl:
    noise:
      std_dev: 0.2
    outliers:
      probability: 0.001
      impact_factor: 0.1
    dropout_probability: 0.0005
    speed_cutoff: 0.01
    quantization_bits: 12
