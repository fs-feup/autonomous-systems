state_estimation:
  estimation_method: "ukf" # "ukf" or ... -> name of the state estimation method
  process_model_name: "component_based_vehicle_model" # "component_based_vehicle_model" or ... -> name of the process model
  observation_model_name: "pacsim_sensors" # "sensors_01" or "pacsim_sensors" or ... -> name of the observation model

  state_estimation_freq: 100.0 # Frequency of state estimation updates in Hz

  vehicle_model: "FSFEUP02"  # Options: "FSFEUP02"

  velocity_x_process_noise: 0.01 # variance of the noise for the velocity in x
  velocity_y_process_noise: 0.03 # variance of the noise for the velocity in y
  yaw_rate_process_noise: 0.02 # variance of the noise for the yaw rate
  acceleration_x_process_noise: 0.01 # variance of the noise for the acceleration in x
  acceleration_y_process_noise: 0.01 # variance of the noise for the acceleration in y
  steering_angle_process_noise: 1e-3 # variance of the noise for the steering angle
  wheel_speed_process_noise: 0.05 # variance of the noise for the wheel speeds
  
  imu_acceleration_x_noise: 0.05 # variance of the noise for the acceleration in x from IMU
  imu_acceleration_y_noise: 0.05 # variance of the noise for the acceleration in y from IMU  
  imu_rotational_noise: 0.1 # variance of the noise for the rotational velocity from IMU
  wheel_speed_noise: 0.1 # variance of the noise for the wheel speeds from encoders
  steering_angle_noise: 1e-3 # variance of the noise for the steering angle from steering sensor
  motor_rpm_noise: 0.1 # variance of the noise for the motor rpm from motor sensor

  mean_weight: 0.4
  alpha: 0.15 # UKF alpha parameter 
  beta: 2.0 # UKF beta parameter
  kappa: 0.0 # UKF kappa parameter