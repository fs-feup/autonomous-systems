visualization:
  track_visualization: generated_track  # Options: "asphalt_texture_everywhere", "generated_track"
  track_surface:
    max_boundary_segment_length: 30.0
    max_loop_segment_length: 30.0
    cone_clearance: 1.50
    curb_width: 0.45
    curb_block_length: 0.80
    curb_z: 0.018
    asphalt_z: 0.004
  position:
    z: -0.02
  # The ground plane is sized to the track: its extent is the cone bounding box
  # grown by this margin on every side, and it is centred on the track. Only used
  # when a track is loaded; otherwise fallback_size applies.
  margin: 100.0
  fallback_size: 400.0
  # Physical size of one grass texture tile, in metres. The texture holds blades
  # 10-60 px of 1024, so at 1.0 m a blade is 1-6 cm -- about right next to a car
  # with a 1.53 m wheelbase. The plane's UVs are generated to match, so the grass
  # stays the same real size whatever track is loaded.
  grass_tile_size_m: 1.0
  color:
    r: 0.78
    g: 0.78
    b: 0.78
    a: 1.0
  timing_line:
    target_cell_length: 0.5
    row_count: 2
    total_width: 0.45
    z: 0.01
    height: 0.02

lap_finish:
  timing_line_gate_margin: 2.0
  minimum_lap_time: 3.0
  minimum_lap_distance: 20.0
  penalties:
    default_cone: 2.0
    skidpad_cone: 0.2
