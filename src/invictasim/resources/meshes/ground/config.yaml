visualization:
  track_visualization: generated_track  # Options: "asphalt_texture_everywhere", "generated_track"
  track_surface:
    max_boundary_segment_length: 30.0
    max_loop_segment_length: 30.0
    cone_clearance: 1.50
    curb_width: 0.45
    curb_block_length: 0.80
    curb_z: 0.018
    asphalt_z: 0.004
  position:
    x: 0.0
    y: 0.0
    z: -0.02
  scale:
    x: 600.0
    y: 600.0
    z: 1.0
  color:
    r: 0.78
    g: 0.78
    b: 0.78
    a: 1.0
  timing_line:
    target_cell_length: 0.5
    row_count: 2
    total_width: 0.45
    z: 0.01
    height: 0.02

lap_finish:
  timing_line_gate_margin: 2.0
  minimum_lap_time: 3.0
  minimum_lap_distance: 20.0
  penalties:
    default_cone: 2.0
    skidpad_cone: 0.2
