      - name: Build and Test SLAM inside Local Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fsfeup-ros-base:latest bash -c "
            source /opt/ros/humble/setup.bash &&
            export LD_LIBRARY_PATH=/usr/local/lib:\$LD_LIBRARY_PATH &&
            colcon build --packages-up-to slam &&
            source install/setup.bash &&
            colcon test --packages-select slam --event-handler=console_direct+ &&
            colcon test-result --all --verbose
