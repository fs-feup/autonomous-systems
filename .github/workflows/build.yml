name: Testing and Building

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: humble
  CI_CACHE_DIR: /opt/fsfeup-ci-cache
  BUILD_PACKAGES: >-
    common_lib
    perception
    slam
    velocity_estimation
    control
    planning
    inspection
    mocker_node
    evaluator

jobs:
  build:
    name: Build once
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Prepare persistent CI cache directories
        run: |
          set -euo pipefail
          sudo mkdir -p "${CI_CACHE_DIR}/dependency-stamps"
          sudo mkdir -p "${CI_CACHE_DIR}/ccache"
          sudo chown -R "$(id -u):$(id -g)" "${CI_CACHE_DIR}"

      - name: Install only missing dependencies when manifests change
        run: |
          set -euo pipefail

          DEP_FILES=$(
            {
              find . -name package.xml -print
              find . -name dependencies_install.sh -print
            } | sort
          )

          DEPS_HASH=$(echo "${DEP_FILES}" | xargs sha256sum | sha256sum | awk '{print $1}')
          STAMP_FILE="${CI_CACHE_DIR}/dependency-stamps/${DEPS_HASH}"

          if [[ -f "${STAMP_FILE}" ]]; then
            echo "Dependency manifests unchanged. Skipping dependency install."
            exit 0
          fi

          echo "Dependency manifests changed or first run. Checking/installing missing dependencies."

          source /opt/ros/${ROS_DISTRO}/setup.bash

          sudo apt-get update

          # rosdep installs only missing system dependencies using apt underneath.
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro "${ROS_DISTRO}"

          # Keep these scripts only if they are idempotent.
          # If they build/install heavy libraries from source every time, move those installs
          # to the server bootstrap process instead of running them in CI.
          if [[ -f ./dependencies_install.sh ]]; then
            bash ./dependencies_install.sh
          fi

          if [[ -f ./src/slam/dependencies_install.sh ]]; then
            bash ./src/slam/dependencies_install.sh
          fi

          touch "${STAMP_FILE}"

      - name: Clean previous build output for this run
        run: |
          rm -rf build install log compile_commands.json ci-build-output.tar

      - name: Build all required packages
        run: |
          set -euo pipefail

          source /opt/ros/${ROS_DISTRO}/setup.bash

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          export CCACHE_DIR="${CI_CACHE_DIR}/ccache"
          export PATH="/usr/lib/ccache:${PATH}"
          ccache --max-size=10G || true

          bear -- colcon build \
            --parallel-workers 1 \
            --packages-up-to ${BUILD_PACKAGES} \
            --cmake-args \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          ccache --show-stats || true

      - name: Pack compiled workspace
        run: |
          tar -cf ci-build-output.tar build install log compile_commands.json

      - name: Upload compiled workspace
        uses: actions/upload-artifact@v4
        with:
          name: colcon-build-output
          path: ci-build-output.tar
          retention-days: 1

  sonarcloud:
    name: SonarCloud analysis
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    env:
      SONAR_SCANNER_VERSION: 6.0.0.4432
      SONAR_SERVER_URL: https://sonarcloud.io
      SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.0.0.4432-linux.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Download compiled workspace
        uses: actions/download-artifact@v4
        with:
          name: colcon-build-output
          path: .

      - name: Extract compiled workspace
        run: |
          tar -xf ci-build-output.tar

      - name: Install Sonar scanner if missing
        run: |
          set -euo pipefail
          sudo mkdir -p "${CI_CACHE_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${CI_CACHE_DIR}"

          SCANNER_DIR="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux"

          if [[ -x "${SCANNER_DIR}/bin/sonar-scanner" ]]; then
            echo "Sonar scanner already installed."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl -sSL "${SONAR_SCANNER_DOWNLOAD_URL}" --output sonar-scanner.zip
          unzip -q sonar-scanner.zip -d "${CI_CACHE_DIR}"

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin:${PATH}"
          sonar-scanner --define sonar.cfamily.compile-commands="./compile_commands.json"

  test:
    name: Test ${{ matrix.package }}
    needs: build
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        package:
          - perception
          - slam
          - velocity_estimation
          - control
          - planning
          - inspection
          - mocker_node
          - evaluator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Download compiled workspace
        uses: actions/download-artifact@v4
        with:
          name: colcon-build-output
          path: .

      - name: Extract compiled workspace
        run: |
          tar -xf ci-build-output.tar

      - name: Test ${{ matrix.package }}
        run: |
          set -euo pipefail

          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          colcon test \
            --packages-select "${{ matrix.package }}" \
            --event-handlers console_direct+

          colcon test-result --all --verbose

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.package }}
          path: |
            log/
            build/${{ matrix.package }}/Testing/
            build/${{ matrix.package }}/test_results/
          if-no-files-found: ignore
          retention-days: 7
