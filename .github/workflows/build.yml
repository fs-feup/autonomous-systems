name: Testing and Building

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: humble
  CI_CACHE_DIR: ${{ github.workspace }}/../_ci_cache

  # Peak compilers = COLCON_PARALLEL_WORKERS * MAKEFLAGS -j. Keep it <= 8 or the
  # runner runs out of RAM. MAKEFLAGS only works with the Make generator.
  COLCON_PARALLEL_WORKERS: 2
  MAKEFLAGS: -j4

  BUILD_PACKAGES: >-
    common_lib
    perception
    slam
    velocity_estimation
    control
    planning
    inspection
    invictasim
    evaluator

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    name: Build once
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0
          clean: false

      - name: Prepare persistent CI cache directories
        run: |
          set -euo pipefail
          mkdir -p "${CI_CACHE_DIR}/ccache"

      - name: Check required host tools
        run: |
          set -euo pipefail

          missing=0

          for tool in colcon bear ccache make cmake; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: $tool"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Install the missing tools manually on the self-hosted server, then rerun this workflow."
            echo "Example: sudo apt install python3-colcon-common-extensions python3-rosdep bear ccache make cmake"
            exit 1
          fi

      - name: Check ROS environment
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u

          echo "ROS environment loaded from /opt/ros/${ROS_DISTRO}."

      - name: Clean stale artifacts
        run: |
          rm -f ci-build-output.tar compile_commands.json

      - name: Build all required packages
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          export CCACHE_DIR="${CI_CACHE_DIR}/ccache"
          export PATH="/usr/lib/ccache:${PATH}"
          ccache --max-size=10G || true

          colcon build \
            --parallel-workers "${COLCON_PARALLEL_WORKERS}" \
            --packages-up-to ${BUILD_PACKAGES} \
            --cmake-args \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          ccache --show-stats || true

      - name: Merge CMake compile databases for SonarCloud
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          entries = []
          seen = set()

          for path in sorted(Path('build').glob('**/compile_commands.json')):
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print(f"Skipping {path}: {exc}")
                  continue

              for entry in data:
                  key = (entry.get('directory'), entry.get('file'), entry.get('command'))
                  if key not in seen:
                      seen.add(key)
                      entries.append(entry)

          Path('compile_commands.json').write_text(json.dumps(entries, indent=2))
          print(f"Wrote compile_commands.json with {len(entries)} entries")
          PY

  test:
    permissions:
      contents: read
      pull-requests: read
    name: Test ${{ matrix.package }}
    needs: build
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        package:
          - perception
          - slam
          - velocity_estimation
          - control
          - planning
          - inspection

    steps:
      # No checkout or artifact download: the build job leaves build/ and install/
      # in this persistent self-hosted runner workspace.
      - name: Test ${{ matrix.package }}
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          set -u

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          rm -rf \
            "build/${{ matrix.package }}/Testing" \
            "build/${{ matrix.package }}/test_results"

          colcon test \
            --packages-select "${{ matrix.package }}" \
            --event-handlers console_direct+

          colcon test-result \
            --test-result-base "build/${{ matrix.package }}" \
            --all \
            --verbose

  sonarcloud:
    permissions:
      contents: read
      pull-requests: read
    name: SonarCloud analysis
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    env:
      SONAR_SCANNER_VERSION: 6.0.0.4432
      SONAR_SERVER_URL: https://sonarcloud.io
      SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.0.0.4432-linux.zip
      # Was 10, which exhausted RAM and got the runner service OOM-killed.
      SONAR_CFAMILY_THREADS: 4
      SONAR_SCANNER_JAVA_OPTS: -Xmx4g

    steps:
      - name: Install Sonar scanner in CI cache if missing
        run: |
          set -euo pipefail
          mkdir -p "${CI_CACHE_DIR}"

          command -v curl >/dev/null || { echo "curl is missing. Install it once on the server: sudo apt install curl"; exit 1; }
          command -v unzip >/dev/null || { echo "unzip is missing. Install it once on the server: sudo apt install unzip"; exit 1; }

          SCANNER_DIR="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux"

          if [[ -x "${SCANNER_DIR}/bin/sonar-scanner" ]]; then
            echo "Sonar scanner already installed."
            exit 0
          fi

          curl -sSL "${SONAR_SCANNER_DOWNLOAD_URL}" --output sonar-scanner.zip
          unzip -q sonar-scanner.zip -d "${CI_CACHE_DIR}"
          rm -f sonar-scanner.zip

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin:${PATH}"
          sonar-scanner \
            --define sonar.cfamily.compile-commands="./compile_commands.json" \
            --define sonar.cfamily.threads="${SONAR_CFAMILY_THREADS}"
