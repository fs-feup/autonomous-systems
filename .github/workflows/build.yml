name: Testing and Building

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: humble
  CI_CACHE_DIR: ${{ github.workspace }}/../_ci_cache

  # Peak compilers = COLCON_PARALLEL_WORKERS * MAKEFLAGS -j. Keep it <= 8 or the
  # runner runs out of RAM. MAKEFLAGS only works with the Make generator.
  COLCON_PARALLEL_WORKERS: 2
  MAKEFLAGS: -j4

  BUILD_PACKAGES: >-
    common_lib
    perception
    slam
    velocity_estimation
    control
    planning
    inspection
    invictasim
    evaluator
    simulation_runner

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    name: Build once
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0
          clean: false

      - name: Prepare persistent CI cache directories
        run: |
          set -euo pipefail
          mkdir -p "${CI_CACHE_DIR}/ccache"

      - name: Check required host tools
        run: |
          set -euo pipefail

          missing=0

          for tool in colcon bear ccache make cmake; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: $tool"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Install the missing tools manually on the self-hosted server, then rerun this workflow."
            echo "Example: sudo apt install python3-colcon-common-extensions python3-rosdep bear ccache make cmake"
            exit 1
          fi

      - name: Check ROS environment
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u

          echo "ROS environment loaded from /opt/ros/${ROS_DISTRO}."

      - name: Clean stale artifacts
        run: |
          rm -f ci-build-output.tar compile_commands.json

          # The workspace persists between runs and colcon leaves generated code behind for
          # messages that were deleted, which leaves custom_interfaces' python typesupport
          # referencing symbols nothing defines any more. Rebuild it when such an orphan shows
          # up, rather than every run, so the cache still does its job.
          generated=install/custom_interfaces/local/lib/python3.10/dist-packages/custom_interfaces/msg
          if [ -d "$generated" ]; then
            sources=$(ls src/custom_interfaces/msg/*.msg 2>/dev/null | xargs -n1 basename \
                      | sed 's/\.msg$//' | sed -E 's/([a-z0-9])([A-Z])/\1_\2/g' \
                      | tr '[:upper:]' '[:lower:]' | sort)
            for module in "$generated"/_*.py; do
              base=$(basename "$module")
              [ "$base" = "__init__.py" ] && continue
              name=${base#_}; name=${name%.py}
              if ! printf '%s\n' "$sources" | grep -qx "$name"; then
                echo "custom_interfaces still has generated code for removed message '$name'; rebuilding it"
                rm -rf build/custom_interfaces install/custom_interfaces
                break
              fi
            done
          fi

      - name: Ensure acados is installed
        run: |
          set -euo pipefail

          # acados lives in build/acados-install but is not built by colcon, so a fresh or
          # cleaned workspace has to put it back before control and planning can configure.
          # Built directly rather than via src/control/dependencies_install.sh, which also
          # wants apt and sudo, and which uses -j$(nproc) on a 40 core machine.
          if [ -d build/acados-install/lib ]; then
            echo "acados already present"
            exit 0
          fi

          echo "acados missing; building it"
          git submodule update --init --recursive ext/acados

          cmake -S ext/acados -B ext/acados/build \
            -DACADOS_WITH_QPOASES=ON \
            -DACADOS_WITH_OSQP=ON \
            -DACADOS_WITH_OPENMP=ON \
            -DBLASFEO_TARGET=X64_INTEL_HASWELL \
            -DHPIPM_TARGET=GENERIC \
            -DCMAKE_BUILD_RPATH='$ORIGIN' \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/build/acados-install" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build ext/acados/build --target install -- -j4

      - name: Build all required packages
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          export CCACHE_DIR="${CI_CACHE_DIR}/ccache"
          export PATH="/usr/lib/ccache:${PATH}"
          ccache --max-size=10G || true

          colcon build \
            --parallel-workers "${COLCON_PARALLEL_WORKERS}" \
            --packages-up-to ${BUILD_PACKAGES} \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          ccache --show-stats || true

      - name: Merge CMake compile databases for SonarCloud
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          entries = []
          seen = set()

          for path in sorted(Path('build').glob('**/compile_commands.json')):
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print(f"Skipping {path}: {exc}")
                  continue

              for entry in data:
                  key = (entry.get('directory'), entry.get('file'), entry.get('command'))
                  if key not in seen:
                      seen.add(key)
                      entries.append(entry)

          Path('compile_commands.json').write_text(json.dumps(entries, indent=2))
          print(f"Wrote compile_commands.json with {len(entries)} entries")
          PY

  test:
    permissions:
      contents: read
      pull-requests: read
    name: Test ${{ matrix.package }}
    needs: build
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        package:
          - perception
          - slam
          - velocity_estimation
          - control
          - planning
          - inspection

    steps:
      # No checkout or artifact download: the build job leaves build/ and install/
      # in this persistent self-hosted runner workspace.
      - name: Test ${{ matrix.package }}
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          set -u

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          rm -rf \
            "build/${{ matrix.package }}/Testing" \
            "build/${{ matrix.package }}/test_results"

          colcon test \
            --packages-select "${{ matrix.package }}" \
            --event-handlers console_direct+

          colcon test-result \
            --test-result-base "build/${{ matrix.package }}" \
            --all \
            --verbose

  simulate:
    permissions:
      contents: read
      pull-requests: write
    name: Simulation scenarios
    needs: [build, test]
    # Ordered after the tests so the scenarios get an idle machine, but a failing test does
    # not skip them: only the build has to succeed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: [self-hosted, linux]

    # No continue-on-error: a failed scenario must show red here and on the pull request.
    # It still does not block merging, because main requires no status checks.

    # Not keyed on the ref: lap times need an idle machine, so runs queue machine wide.
    concurrency:
      group: simulation-runner
      cancel-in-progress: false

    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      # colcon runs no tests for ament_python packages here, so run them with pytest.
      - name: Test the simulation runner
        continue-on-error: true
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          set -u

          python3 -m pytest src/simulation_runner/test -q

      - name: Run the simulation scenarios
        env:
          # The simulator opens an SDL window; CI has no display.
          SDL_VIDEODRIVER: dummy
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          set -u

          export CMAKE_PREFIX_PATH=/usr/local:${CMAKE_PREFIX_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}

          rm -rf simulation_results

          # The scenarios only mean anything if this machine can hold real time, so record
          # what it is and how loaded it was when they started.
          echo "cores: $(nproc)  model: $(sed -n 's/^model name[ \t]*: //p' /proc/cpuinfo | head -1)"
          echo "load: $(cut -d' ' -f1-3 /proc/loadavg)"
          free -g | head -2

          ros2 run simulation_runner run \
            --keep-going \
            --output simulation_results \
            --author "${AUTHOR}" \
            --branch "${BRANCH}" \
            --pull-request "${PULL_REQUEST}" \
            --run-url "${RUN_URL}"

      - name: Upload simulation logs and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: simulation_results/
          retention-days: 14

      - name: Comment the results on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'simulation_results/summary.md';
            if (!fs.existsSync(path)) {
              core.info('No simulation summary to post.');
              return;
            }

            const marker = '<!-- simulation-results -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }


  sonarcloud:
    permissions:
      contents: read
      pull-requests: read
    name: SonarCloud analysis
    needs: [build, test, simulate]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    env:
      SONAR_SCANNER_VERSION: 6.0.0.4432
      SONAR_SERVER_URL: https://sonarcloud.io
      SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.0.0.4432-linux.zip
      # Was 10, which exhausted RAM and got the runner service OOM-killed.
      SONAR_CFAMILY_THREADS: 4
      SONAR_SCANNER_JAVA_OPTS: -Xmx4g

    steps:
      - name: Install Sonar scanner in CI cache if missing
        run: |
          set -euo pipefail
          mkdir -p "${CI_CACHE_DIR}"

          command -v curl >/dev/null || { echo "curl is missing. Install it once on the server: sudo apt install curl"; exit 1; }
          command -v unzip >/dev/null || { echo "unzip is missing. Install it once on the server: sudo apt install unzip"; exit 1; }

          SCANNER_DIR="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux"

          if [[ -x "${SCANNER_DIR}/bin/sonar-scanner" ]]; then
            echo "Sonar scanner already installed."
            exit 0
          fi

          curl -sSL "${SONAR_SCANNER_DOWNLOAD_URL}" --output sonar-scanner.zip
          unzip -q sonar-scanner.zip -d "${CI_CACHE_DIR}"
          rm -f sonar-scanner.zip

      - name: Run SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${CI_CACHE_DIR}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin:${PATH}"
          sonar-scanner \
            --define sonar.cfamily.compile-commands="./compile_commands.json" \
            --define sonar.cfamily.threads="${SONAR_CFAMILY_THREADS}"
