name: Testing and Building

on:
  push:
    branches:
      [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  build: # Sonarcloud analysis
    name: sonarcloud-build
    if: github.event_name == 'pull_request'
    runs-on: self-hosted 

    env:
      SONAR_SCANNER_VERSION: 6.0.0.4432
      SONAR_SERVER_URL: "https://sonarcloud.io"
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directoryd
      SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.0.0.4432-linux.zip
      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Run SonarCloud Analysis inside Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
          -e GITHUB_TOKEN=$GITHUB_TOKEN -e SONAR_TOKEN=$SONAR_TOKEN \
          fsfeup-ros-base:latest bash -c "
            curl -s ${{ env.SONAR_SCANNER_DOWNLOAD_URL }} --output sonar-scanner.zip &&
            unzip -q sonar-scanner.zip &&
            export PATH=\$PATH:/workspace/sonar-scanner-${{env.SONAR_SCANNER_VERSION}}-linux/bin &&
            source /opt/ros/humble/setup.bash &&
            bear -- colcon build --parallel-workers 4 --packages-up-to common_lib perception ekf_state_est control planning inspection mocker_node evaluator &&
            sonar-scanner --define sonar.cfamily.compile-commands='./compile_commands.json'
          "

      - name: Fix workspace permissions
        if: always()
        run: docker run --rm -v ${{ github.workspace }}:/workspace fsfeup-ros-base:latest chmod -R 777 /workspace

  perception:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build and Test Perception inside Local Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fsfeup-ros-base:latest bash -c "
            source /opt/ros/humble/setup.bash &&
            colcon build --packages-up-to perception &&
            source install/setup.bash &&
            colcon test --packages-select perception --event-handler=console_direct+ &&
            colcon test-result --all --verbose
          "
      - name: Fix workspace permissions
        if: always()
        run: docker run --rm -v ${{ github.workspace }}:/workspace fsfeup-ros-base:latest chmod -R 777 /workspace

  slam:
